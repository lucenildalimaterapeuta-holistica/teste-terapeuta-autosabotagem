<script>
    function mudarPagina(nomePagina) {
        const paginas = document.querySelectorAll('.page');

        paginas.forEach(function (pagina) {
            pagina.classList.remove('active');
        });

        const paginaDestino = document.getElementById(
            'page-' + nomePagina
        );

        if (!paginaDestino) {
            console.error(
                'Página não encontrada: page-' + nomePagina
            );
            return;
        }

        paginaDestino.classList.add('active');

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function calcularResultado() {
        let pontuacaoTotal = 0;
        let perguntasRespondidas = 0;

        for (let i = 1; i <= 12; i++) {
            const resposta = document.querySelector(
                'input[name="q' + i + '"]:checked'
            );

            if (resposta) {
                pontuacaoTotal += Number(resposta.value);
                perguntasRespondidas++;
            }
        }

        if (perguntasRespondidas < 12) {
            alert(
                'Responda todas as perguntas antes de ver seu resultado.'
            );
            return;
        }

        const pontuacaoMaxima = 36;
        const porcentagem = Math.round(
            (pontuacaoTotal / pontuacaoMaxima) * 100
        );

        let perfilNome;
        let perfilAnalise;

        if (pontuacaoTotal <= 12) {
            perfilNome = 'Perfil de Consciência e Equilíbrio';

            perfilAnalise = `
                <p>
                    Você demonstra boa consciência sobre sua prática
                    profissional, seus limites e seu valor.
                </p>
                <p>
                    Continue fortalecendo o autocuidado, a supervisão
                    e os espaços de acolhimento emocional.
                </p>
            `;
        } else if (pontuacaoTotal <= 24) {
            perfilNome = 'Perfil de Autossabotagem Sutil';

            perfilAnalise = `
                <p>
                    Algumas formas de autossabotagem podem estar
                    interferindo na sua confiança, nos seus limites
                    e na maneira como reconhece seu valor profissional.
                </p>
                <p>
                    Esses padrões não definem quem você é. Eles representam
                    uma oportunidade de olhar para si com mais acolhimento,
                    consciência e menos cobrança.
                </p>
            `;
        } else {
            perfilNome = 'Perfil de Sobrecarga e Autossacrifício';

            perfilAnalise = `
                <p>
                    Suas respostas indicam padrões relacionados à
                    autossabotagem, à sobrecarga emocional e à dificuldade
                    de reconhecer seu merecimento.
                </p>
                <p>
                    Cuidar de si, estabelecer limites e buscar apoio também
                    fazem parte de uma prática terapêutica ética e sustentável.
                </p>
            `;
        }

        document.getElementById('score-display').textContent =
            porcentagem + '%';

        document.getElementById('perfil-nome').textContent =
            perfilNome;

        document.getElementById('perfil-analise').innerHTML =
            perfilAnalise;

        mudarPagina('resultado');
    }
</script>

</body>
</html>
