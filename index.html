<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terapeuta, qual seu nível de autossabotagem?</title>

    <style>
        :root {
            --rosa: #c87979;
            --rosa-claro: #f2d9d5;
            --vinho: #8f2635;
            --terracota: #b86f59;
            --bege: #f8eee9;
            --bege-escuro: #ead4cb;
            --marrom: #68463e;
            --texto: #4d4543;
            --branco: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #f8eee9 0%,
                    #fffaf8 50%,
                    #efd7d2 100%
                );
            color: var(--texto);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.7;
        }

        button,
        a {
            font-family: inherit;
        }

        .container {
            width: 100%;
            max-width: 920px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 30px 18px;
        }

        .page {
            display: none;
            animation: aparecer 0.45s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .capa,
        .introducao,
        .bloco-perguntas,
        .resultado,
        .pagina-final {
            border: 1px solid rgba(184, 111, 89, 0.15);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 14px 40px rgba(104, 70, 62, 0.12);
        }

        .capa {
            padding: 90px 25px;
            background:
                linear-gradient(
                    135deg,
                    rgba(242, 217, 213, 0.96),
                    rgba(255, 255, 255, 0.98)
                );
            text-align: center;
        }

        .capa h1 {
            max-width: 760px;
            margin: 0 auto 22px;
            color: var(--vinho);
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            line-height: 1.2;
        }

        .capa h2 {
            max-width: 700px;
            margin: 0 auto 35px;
            color: var(--terracota);
            font-size: clamp(1.05rem, 2.5vw, 1.35rem);
            font-style: italic;
            font-weight: 400;
            line-height: 1.5;
        }

        .capa p {
            margin-bottom: 45px;
            color: var(--marrom);
            font-size: 1.1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            padding: 15px 32px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(
                135deg,
                var(--rosa),
                var(--terracota)
            );
            color: var(--branco);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
            box-shadow: 0 9px 24px rgba(200, 121, 121, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(
                135deg,
                var(--terracota),
                var(--vinho)
            );
            box-shadow: 0 13px 30px rgba(143, 38, 53, 0.25);
        }

        .btn:focus-visible,
        .btn-cta-final:focus-visible,
        input:focus-visible + span {
            outline: 3px solid rgba(143, 38, 53, 0.35);
            outline-offset: 4px;
        }

        .btn-secondary {
            background: var(--bege-escuro);
            color: var(--marrom);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #ddc0b6;
            color: var(--vinho);
            box-shadow: none;
        }

        .introducao,
        .bloco-perguntas,
        .resultado,
        .pagina-final {
            padding: clamp(24px, 5vw, 52px);
        }

        .introducao h2,
        .resultado h2 {
            margin-bottom: 30px;
            color: var(--vinho);
            font-size: clamp(1.7rem, 4vw, 2.3rem);
            text-align: center;
        }

        .introducao-texto,
        .perfil-analise,
        .bio {
            margin-bottom: 30px;
            padding: 28px;
            border-left: 5px solid var(--rosa);
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #fff8f5,
                var(--bege)
            );
        }

        .introducao-texto p,
        .bio p {
            margin-bottom: 15px;
        }

        strong {
            color: var(--vinho);
        }

        .botoes-navegacao {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 34px;
        }

        .teste-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .teste-header h2 {
            margin-bottom: 18px;
            color: var(--vinho);
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            line-height: 1.3;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--bege-escuro);
        }

        .progress-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                var(--rosa),
                var(--vinho)
            );
        }

        .pergunta-item {
            margin-bottom: 28px;
            padding: 24px;
            border-left: 5px solid var(--terracota);
            border-radius: 18px;
            background: linear-gradient(
                135deg,
                #fff8f5,
                #f9eee9
            );
        }

        .pergunta-item p {
            margin-bottom: 18px;
            color: var(--vinho);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .pergunta-item label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 13px;
            color: var(--texto);
            cursor: pointer;
        }

        .pergunta-item input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-top: 4px;
            accent-color: var(--vinho);
            cursor: pointer;
            flex-shrink: 0;
        }

        .resultado {
            text-align: center;
        }

        .score-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 155px;
            height: 155px;
            margin: 28px auto;
            border: 7px solid rgba(255, 255, 255, 0.45);
